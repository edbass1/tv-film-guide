# =====================================================================
#  Guida TV Film & Documentari  -  configurazione
#  Fonti: epgshare01 (XMLTV), La Vanguardia (Spagna), dataset IMDb,
#         Wikidata, traduzione automatica offline (de/fr/es -> it).
# =====================================================================

timezone: "Europe/Zurich"
max_days: 6                   # oggi + 5 (epgshare01 di solito copre solo ~4 giorni)
day_starts_at: "05:00"        # i programmi tra 00:00 e 05:00 contano per la sera prima

prime_time:    {from: "20:00", to: "22:30"}
prime_time_es: {from: "20:00", to: "23:00"}   # in Spagna la prima serata inizia più tardi

epg_base: "https://epgshare01.online/epgshare01/epg_ripper_{file}.xml.gz"

