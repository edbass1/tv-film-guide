# ---------------------------------------------------------------------
#  "Il clou"
# ---------------------------------------------------------------------
clou:
  film_min_rating: 7.0
  film_min_votes: 25000
  film_famous_votes: 200000
  film_famous_min_rating: 6.5
  doc_min_rating: 7.5
  doc_min_votes: 300
  classic_max_year: 1985          # gruppo "Classici" in "Per genere"

# ---------------------------------------------------------------------
#  IMDb (dataset ufficiali gratuiti https://datasets.imdbws.com)
# ---------------------------------------------------------------------
imdb:
  enabled: true
  base: "https://datasets.imdbws.com"
  min_votes_without_year: 5000    # senza anno nell'EPG, accetta solo film molto votati
  aka_regions: [DE, AT, CH, FR, IT, ES, GB, US, XWW, CA, BE]

# ---------------------------------------------------------------------
#  Traduzioni (SOLO tedesco, francese, spagnolo -> italiano; l'inglese resta com'è)
# ---------------------------------------------------------------------
translation:
  languages: [de, fr, es]
  engine: marian                  # marian = modelli Helsinki-NLP opus-mt (offline, senza chiave)
  models: {de: "Helsinki-NLP/opus-mt-de-it", fr: "Helsinki-NLP/opus-mt-tc-big-itc-itc", es: "Helsinki-NLP/opus-mt-es-it"}
  max_desc_chars: 420             # descrizioni accorciate (a fine frase) prima di tradurre
  max_seconds_per_run: 2400       # tempo massimo di traduzione per esecuzione; il resto alla prossima
  wikidata_titles: true           # titoli italiani ufficiali da Wikidata (oltre a IMDb)
