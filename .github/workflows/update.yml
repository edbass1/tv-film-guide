name: Aggiorna guida TV

on:
  schedule:
    - cron: "15 */6 * * *"     # ogni 6 ore (UTC)
  workflow_dispatch: {}         # avvio manuale dal tab "Actions"

permissions:
  contents: write

concurrency:
  group: tv-guide
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze (torch solo CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache modelli di traduzione (Hugging Face)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-de-fr-es-en-v2

      - name: Genera la pagina
        env:
          TZ: Europe/Zurich
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python build.py

      - name: Salva il risultato (docs/ + cache traduzioni)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache/translations.json cache/wikidata_it.json cache/wikidata_lang.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiornamento guida TV $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs || true
            git push
          fi
